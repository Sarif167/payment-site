<!DOCTYPE html>
<html lang="en">
<head>

Secure BharatPe UPI Payment
</p>

<img src="qr.png" class="qr">

<div class="upiBox">

<p>UPI ID</p>

<input
id="upi"
type="text"
value="BHARATPE.9QOQKOZ8Q466572@unitype"
readonly>

<button class="copyBtn"
onclick="copyUPI()">
Copy UPI ID
</button>

</div>

<input
id="name"
type="text"

id="amount"
type="number"

id="txn"
type="text"

class="payBtn"
