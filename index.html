<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Payment</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
width:300px;
padding:18px;
border-radius:15px;
box-shadow:0 5px 20px #ccc;
text-align:center;
}

.logo{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
}

h2{
font-size:24px;
margin:10px 0 5px;
}

.name{
font-size:16px;
color:#555;
font-weight:bold;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:12px;
font-size:17px;
border:0;
border-radius:8px;
color:white;
}

.pay{
background:#00a651;
}

.telegram{
background:#0088cc;
}

</style>

</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>UPI Payment</h2>

<div class="name">
Payment To: Sekh Sarif
</div>

<input 
type="number"
id="amount"
placeholder="Enter Amount">


<button class="pay" onclick="pay()">
💳 Pay Now
</button>


<button class="telegram" onclick="winnerScreenshot()">
📸 Owner Screenshot
</button>


</div>


<script>

function pay(){

let amount=document.getElementById("amount").value;

if(amount==""){
alert("Enter Amount");
return;
}

let upi="upi://pay?pa=BHARATPE.9Q0Q0K0Z8Q466572@unitype&pn=Sekh%20Sarif&am="+amount+"&cu=INR";

window.location.href=upi;

}


function winnerScreenshot(){

window.open("https://t.me/botmaster55","_blank");

}

</script>

</body>
</html>
