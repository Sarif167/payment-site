<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Payment Method</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
width:340px;
padding:25px 20px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,0.15);
text-align:center;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

h2{
font-size:32px;
margin:10px 0;
font-weight:700;
background:linear-gradient(90deg,#007bff,#6a00ff);
-webkit-background-clip:text;
color:transparent;
}

.payto{
font-size:18px;
color:#555;
font-weight:bold;
margin-top:20px;
}

.name{
font-size:36px;
font-weight:800;
color:#5a00ff;
margin:10px 0 25px;
}

input{
width:100%;
padding:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
font-size:20px;
border:none;
border-radius:12px;
margin-top:15px;
color:white;
cursor:pointer;
}

.pay{
background:#00a651;
}

.telegram{
background:#0088cc;
}

</style>

</head>


<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>UPI Payment Method</h2>

<div class="payto">
Payment To:
</div>

<div class="name">
Sekh Sarif
</div>


<input 
type="number"
id="amount"
placeholder="Enter Amount">


<button class="pay" onclick="pay()">
💳 Pay Now
</button>


<button class="telegram" onclick="winnerScreenshot()">
📸 Owner Screenshot
</button>


</div>


<script>

function pay(){

let amount=document.getElementById("amount").value;

if(amount==""){
alert("Enter Amount");
return;
}

let upi="upi://pay?pa=BHARATPE.9Q0Q0K0Z8Q466572@unitype&pn=Sekh%20Sarif&am="+amount+"&cu=INR";

window.location.href=upi;

}


function winnerScreenshot(){

window.open("https://t.me/botmaster55","_blank");

}

</script>


</body>
</html>
