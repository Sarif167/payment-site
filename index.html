<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Payment</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#fff;
width:340px;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
text-align:center;
}

.logo{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

h2{
margin:10px 0;
}

.name{
font-size:18px;
color:#555;
margin-bottom:20px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
color:white;
}

.pay{
background:#00a651;
}

.pay:hover{
background:#008a43;
}

.telegram{
background:#0088cc;
}

.telegram:hover{
background:#0077b5;
}

</style>

</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>UPI Payment</h2>

<div class="name">
Payment To: Sekh Sarif
</div>

<input 
type="number" 
id="amount" 
placeholder="Enter Amount">

<button class="pay" onclick="pay()">
💳 Pay Now
</button>

<button class="telegram" onclick="winnerScreenshot()">
📸 Woner Screenshot
</button>

</div>


<script>

function pay(){

let amount=document.getElementById("amount").value;

if(amount==""){
alert("Enter Amount");
return;
}

let upi="upi://pay?pa=BHARATPE.9Q0Q0K0Z8Q466572@unitype&pn=Amir%20Bhai&am="+amount+"&cu=INR";

window.location.href=upi;

}


function winnerScreenshot(){

window.open("https://t.me/botmaster55","_blank");

}

</script>

</body>
</html>
